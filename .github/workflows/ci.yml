# One fast job, run on every pull request (any base, so stacked PRs are checked too)
# and on every push to main: install, strict type-check of both workspaces (source and
# tests), web build, server and web tests. The tests build tiny throwaway git repos in
# the OS temp dir; nothing touches the network except `npm ci`. This job ("checks") is
# the required check for main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the version development runs on; engines allows >=22.18
          cache: npm

      - run: npm ci

      - name: Type-check (server and web, source and tests)
        run: npm run typecheck

      - name: Build (web)
        run: npm run build

      - name: Tests (server and web)
        run: npm test
