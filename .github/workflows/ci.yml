# Three parallel jobs, run on every pull request (any base, so stacked PRs are checked too)
# and on every push to main. Each shows as its own check on a PR, and all three are
# required to merge into main:
#   typecheck  strict tsc for both workspaces, source and tests
#   build      the web production build
#   test       server and web tests (they build tiny throwaway git repos in the OS temp
#              dir; nothing touches the network except `npm ci`)
# Each job installs dependencies itself (npm's cache keeps that quick), so one failing
# job never hides the others' results.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the version development runs on; engines allows >=22.18
          cache: npm
      - run: npm ci
      - name: Type-check (server and web, source and tests)
        run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (web)
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests (server and web)
        run: npm test
